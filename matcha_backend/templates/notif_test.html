<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Socket.IO Tester - Like Postman</title>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1e1e1e;
            color: #d4d4d4;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .header {
            background: #252526;
            padding: 15px 20px;
            border-bottom: 1px solid #3e3e42;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .header h1 {
            font-size: 18px;
            color: #fff;
            margin-right: 20px;
        }
        .header input {
            flex: 1;
            padding: 8px 12px;
            background: #3c3c3c;
            border: 1px solid #5a5a5a;
            color: #d4d4d4;
            border-radius: 4px;
            font-size: 14px;
        }
        .header button {
            padding: 8px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.2s;
        }
        .connect-btn {
            background: #007acc;
            color: white;
        }
        .connect-btn:hover { background: #005a9e; }
        .disconnect-btn {
            background: #dc3545;
            color: white;
        }
        .disconnect-btn:hover { background: #c82333; }
        .status {
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }
        .status.connected {
            background: #10b981;
            color: white;
        }
        .status.disconnected {
            background: #6b7280;
            color: white;
        }
        .main-container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }
        .sidebar {
            width: 300px;
            background: #252526;
            border-right: 1px solid #3e3e42;
            padding: 20px;
            overflow-y: auto;
        }
        .sidebar h3 {
            font-size: 14px;
            color: #888;
            margin-bottom: 15px;
            text-transform: uppercase;
        }
        .event-group {
            margin-bottom: 25px;
        }
        .event-btn {
            width: 100%;
            padding: 10px 15px;
            background: #2d2d30;
            border: 1px solid #3e3e42;
            color: #d4d4d4;
            text-align: left;
            border-radius: 4px;
            cursor: pointer;
            margin-bottom: 8px;
            transition: all 0.2s;
            font-size: 13px;
        }
        .event-btn:hover {
            background: #3e3e42;
            border-color: #007acc;
        }
        .event-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .input-group {
            margin-top: 10px;
        }
        .input-group label {
            display: block;
            font-size: 12px;
            color: #888;
            margin-bottom: 5px;
        }
        .input-group input {
            width: 100%;
            padding: 6px 10px;
            background: #3c3c3c;
            border: 1px solid #5a5a5a;
            color: #d4d4d4;
            border-radius: 3px;
            font-size: 13px;
        }
        .content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .tabs {
            display: flex;
            background: #2d2d30;
            border-bottom: 1px solid #3e3e42;
        }
        .tab {
            padding: 12px 24px;
            background: transparent;
            border: none;
            color: #888;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            font-size: 13px;
        }
        .tab.active {
            color: #fff;
            border-bottom-color: #007acc;
        }
        .tab-content {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }
        .log-entry {
            padding: 10px 15px;
            margin-bottom: 8px;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            border-left: 3px solid;
        }
        .log-info {
            background: #1e3a5f;
            border-left-color: #3b82f6;
        }
        .log-success {
            background: #1e4429;
            border-left-color: #10b981;
        }
        .log-error {
            background: #4a1c1c;
            border-left-color: #ef4444;
        }
        .log-notification {
            background: #4a3c1c;
            border-left-color: #f59e0b;
        }
        .log-time {
            color: #6b7280;
            margin-right: 10px;
        }
        .json-viewer {
            background: #1e1e1e;
            padding: 15px;
            border-radius: 4px;
            border: 1px solid #3e3e42;
            margin-top: 10px;
            overflow-x: auto;
        }
        .clear-btn {
            background: #6b7280;
            color: white;
            padding: 6px 12px;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            font-size: 12px;
            margin-bottom: 15px;
        }
        .clear-btn:hover { background: #4b5563; }
    </style>
</head>
<body>
    <div class="header">
        <h1>🔌 Socket.IO Tester</h1>
        <input type="text" id="serverUrl" placeholder="Server URL" value="http://localhost:5000">
        <button class="connect-btn" onclick="connectSocket()">Connect</button>
        <button class="disconnect-btn" onclick="disconnectSocket()" style="display:none" id="disconnectBtn">Disconnect</button>
        <span class="status disconnected" id="statusBadge">Disconnected</span>
    </div>

    <div class="main-container">
        <div class="sidebar">
            <div class="event-group">
                <h3>Quick Actions</h3>
                <div class="input-group">
                    <label>User ID</label>
                    <input type="number" id="userId" value="1" placeholder="Enter user ID">
                </div>
                <button class="event-btn" onclick="joinNotifications()" id="joinBtn" disabled>
                    📥 Join Notifications
                </button>
                <button class="event-btn" onclick="leaveNotifications()" id="leaveBtn" disabled>
                    📤 Leave Notifications
                </button>
            </div>

            <div class="event-group">
                <h3>Custom Event</h3>
                <div class="input-group">
                    <label>Event Name</label>
                    <input type="text" id="customEvent" placeholder="e.g., mark_notification_seen">
                </div>
                <div class="input-group">
                    <label>Data (JSON)</label>
                    <input type="text" id="customData" placeholder='{"notification_id": 1}'>
                </div>
                <button class="event-btn" onclick="emitCustomEvent()" id="customBtn" disabled>
                    🚀 Emit Event
                </button>
            </div>

            <div class="event-group">
                <h3>Presets</h3>
                <button class="event-btn" onclick="loadPreset('join_user_1')">Join as User 1</button>
                <button class="event-btn" onclick="loadPreset('join_user_2')">Join as User 2</button>
                <button class="event-btn" onclick="loadPreset('mark_seen')">Mark Notification Seen</button>
            </div>
        </div>

        <div class="content">
            <div class="tabs">
                <button class="tab active" onclick="switchTab('logs')">Console Logs</button>
                <button class="tab" onclick="switchTab('events')">Events Received</button>
            </div>
            <div class="tab-content">
                <button class="clear-btn" onclick="clearLogs()">Clear All</button>
                <div id="logsContainer">
                    <div class="log-entry log-info">
                        <span class="log-time">[Ready]</span> 
                        Enter server URL and click Connect to start testing
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let socket = null;
        let currentUserId = null;
        let eventHistory = [];

        function log(message, type = 'info') {
            const container = document.getElementById('logsContainer');
            const entry = document.createElement('div');
            entry.className = `log-entry log-${type}`;
            const time = new Date().toLocaleTimeString();
            entry.innerHTML = `<span class="log-time">[${time}]</span> ${message}`;
            container.appendChild(entry);
            container.scrollTop = container.scrollHeight;
        }

        function updateStatus(connected) {
            const badge = document.getElementById('statusBadge');
            const disconnectBtn = document.getElementById('disconnectBtn');
            const joinBtn = document.getElementById('joinBtn');
            const leaveBtn = document.getElementById('leaveBtn');
            const customBtn = document.getElementById('customBtn');

            if (connected) {
                badge.textContent = 'Connected';
                badge.className = 'status connected';
                disconnectBtn.style.display = 'inline-block';
                joinBtn.disabled = false;
                customBtn.disabled = false;
            } else {
                badge.textContent = 'Disconnected';
                badge.className = 'status disconnected';
                disconnectBtn.style.display = 'none';
                joinBtn.disabled = true;
                leaveBtn.disabled = true;
                customBtn.disabled = true;
            }
        }

        function connectSocket() {
            const serverUrl = document.getElementById('serverUrl').value;
            if (!serverUrl) {
                log('❌ Please enter a server URL', 'error');
                return;
            }

            log(`🔄 Connecting to ${serverUrl}...`, 'info');

            socket = io(serverUrl, {
                transports: ['websocket', 'polling'],
                reconnection: true
            });

            socket.on('connect', () => {
                log('✅ Connected successfully!', 'success');
                updateStatus(true);
            });

            socket.on('disconnect', () => {
                log('❌ Disconnected from server', 'error');
                updateStatus(false);
            });

            socket.on('connect_error', (error) => {
                log(`❌ Connection error: ${error.message}`, 'error');
            });

            // Listen to ALL events
            socket.onAny((eventName, ...args) => {
                const data = args[0];
                eventHistory.push({ eventName, data, timestamp: new Date() });
                
                if (eventName === 'new_notification') {
                    log(`🔔 <strong>NEW NOTIFICATION:</strong> ${JSON.stringify(data)}`, 'notification');
                } else if (eventName === 'unread_count' || eventName === 'unread_count_updated') {
                    log(`📊 Unread count: ${data.count}`, 'info');
                } else {
                    log(`📨 Event "${eventName}": ${JSON.stringify(data)}`, 'info');
                }
            });
        }

        function disconnectSocket() {
            if (socket) {
                socket.disconnect();
                log('🔌 Disconnected by user', 'info');
                updateStatus(false);
            }
        }

        function joinNotifications() {
            const userId = parseInt(document.getElementById('userId').value);
            if (!userId) {
                log('❌ Please enter a user ID', 'error');
                return;
            }

            currentUserId = userId;
            socket.emit('join_notifications', { user_id: userId });
            log(`📥 Joining notifications for user ${userId}`, 'success');
            document.getElementById('leaveBtn').disabled = false;
        }

        function leaveNotifications() {
            if (!currentUserId) return;

            socket.emit('leave_notifications', { user_id: currentUserId });
            log(`📤 Left notifications for user ${currentUserId}`, 'info');
            currentUserId = null;
            document.getElementById('leaveBtn').disabled = true;
        }

        function emitCustomEvent() {
            const eventName = document.getElementById('customEvent').value;
            const dataStr = document.getElementById('customData').value;

            if (!eventName) {
                log('❌ Please enter an event name', 'error');
                return;
            }

            try {
                const data = dataStr ? JSON.parse(dataStr) : {};
                socket.emit(eventName, data);
                log(`🚀 Emitted "${eventName}" with data: ${JSON.stringify(data)}`, 'success');
            } catch (e) {
                log(`❌ Invalid JSON: ${e.message}`, 'error');
            }
        }

        function loadPreset(preset) {
            switch(preset) {
                case 'join_user_1':
                    document.getElementById('userId').value = 1;
                    if (socket && socket.connected) joinNotifications();
                    break;
                case 'join_user_2':
                    document.getElementById('userId').value = 2;
                    if (socket && socket.connected) joinNotifications();
                    break;
                case 'mark_seen':
                    document.getElementById('customEvent').value = 'mark_notification_seen';
                    document.getElementById('customData').value = '{"notification_id": 1, "user_id": 1}';
                    break;
            }
        }

        function clearLogs() {
            document.getElementById('logsContainer').innerHTML = '';
        }

        function switchTab(tab) {
            // Simple tab switching - you can expand this
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');
        }
    </script>
</body>
</html>
