# Matcha Application Configuration

# Flask Settings
SECRET_KEY: 'change-this-in-production-use-env-variable'
DEBUG: true
TESTING: false

# Mail Configuration
MAIL_SERVER: 'smtp.gmail.com'
MAIL_PORT: 587
MAIL_USE_TLS: true
MAIL_USE_SSL: false
MAIL_USERNAME: ''  # Set via environment variable
MAIL_PASSWORD: ''  # Set via environment variable SMTP_SECRET_KEY
MAIL_DEFAULT_SENDER: 'noreply@matcha.com'

# File Upload Settings
MAX_CONTENT_LENGTH: 16777216  # 16MB in bytes
UPLOAD_FOLDER: 'static/profiles'

# Database Settings (configured via environment variables)
# DB_HOST, DB_PORT, DB_NAME, DB_USER, DB_PASSWORD

# Redis Settings (configured via environment variables)
# REDIS_HOST, REDIS_PORT, REDIS_DB

# JWT Settings (configured via environment variables)
# JWT_ACCESS_TOKEN, JWT_REFRESH_TOKEN

# Application Settings
SESSION_COOKIE_SECURE: false  # Set to true in production with HTTPS
SESSION_COOKIE_HTTPONLY: true
SESSION_COOKIE_SAMESITE: 'Lax'
PERMANENT_SESSION_LIFETIME: 3600  # 1 hour in seconds
